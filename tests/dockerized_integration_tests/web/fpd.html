<!doctype html>
<html>
  <body>
    <h1>FPD test page</h1>
    <div id="result">idle</div>

    <script>
      const POLL_INTERVAL_MS = 100;
      const POLL_DURATION_MS = 5000;
      const UPLOAD_TIMEOUT_MS = 2000;
      const NUM_POLLS = POLL_DURATION_MS / POLL_INTERVAL_MS;

      function triggerCanvasFingerprinting(canvas) {
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        for (let i = 0; i < 20; i++) {
          ctx.beginPath();
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = `rgb(${i}, ${i * 2}, ${i * 3})`;
          ctx.font = `${12 + i}px Arial`;
          ctx.fillText(`JShelter FPD test ${i}`, 10, 50);
          ctx.closePath();

          canvas.toDataURL();
          ctx.getImageData(0, 0, 100, 50);
        }
      }

      function triggerWebGLFingerprinting(canvas) {
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (!gl) 
          return;

        gl.getExtension("WEBGL_debug_renderer_info");
        gl.getSupportedExtensions();
        gl.getParameter(gl.VENDOR);
        gl.getParameter(gl.RENDERER);
        gl.getParameter(gl.VERSION);
        gl.getParameter(gl.SHADING_LANGUAGE_VERSION);
      }

      function triggerTimerFingerprinting() {
        for (let i = 0; i < 20; i++) {
          performance.now();
        }
      }

      function triggerNavigatorFingerprinting() {
        navigator.userAgent;
        navigator.platform;
        navigator.language;
        navigator.languages;
        navigator.hardwareConcurrency;
        navigator.cookieEnabled;
        navigator.doNotTrack;
        navigator.plugins.length;
        navigator.mimeTypes.length;
      }

      function triggerScreenFingerprinting() {
        screen.width;
        screen.height;
        screen.availWidth;
        screen.availHeight;
        screen.colorDepth;
        screen.pixelDepth;

        window.innerWidth;
        window.innerHeight;
        window.outerWidth;
        window.outerHeight;
        window.devicePixelRatio;
      }

      function triggerStorageFingerprinting() {
        localStorage.setItem("fpd-local", Math.random().toString());
        sessionStorage.setItem("fpd-session", Math.random().toString());
        document.cookie = `fpd_cookie=${Math.random()}; path=/`;
      }

      function runFingerprinting() {
        const canvas = document.createElement("canvas");
        canvas.width = 400;
        canvas.height = 100;

        triggerCanvasFingerprinting(canvas);
        triggerWebGLFingerprinting(canvas);
        triggerTimerFingerprinting();
        triggerNavigatorFingerprinting();
        triggerScreenFingerprinting();
        triggerStorageFingerprinting();
      }

      function delay(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function runTest() {
        const params = new URLSearchParams(window.location.search);
        const doFingerprinting = params.get("fingerprint") !== "false";

        if (doFingerprinting) {
          runFingerprinting();
        }

        const startTime = performance.now();
        let firstBlockedMs = null;
        let blockedCount = 0;

        for (let i = 0; i < NUM_POLLS; i++) {
          await delay(POLL_INTERVAL_MS);
          const currentTime = Math.round(performance.now() - startTime);

          const request = fetch("/fpd-collect", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ step: "fingerprint-upload"}),
          })
            .then((r) => (r.ok ? "loaded" : "error"))
            .catch(() => "blocked");

          const status = await Promise.race([request, delay(UPLOAD_TIMEOUT_MS).then(() => "blocked")]);

          if (status === "blocked") {
            blockedCount++;
            if (firstBlockedMs === null) 
                firstBlockedMs = currentTime;
          }
        }

        document.getElementById("result").textContent = JSON.stringify({
          first_blocked_ms: firstBlockedMs,
          total: NUM_POLLS,
          blocked_count: blockedCount,
        });
      }

      window.addEventListener("load", runTest);
    </script>
  </body>
</html>
