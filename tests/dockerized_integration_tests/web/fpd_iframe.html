<!doctype html>
<html>
  <body>
    <script>
      const params = new URLSearchParams(window.location.search);

      let depth = Number(params.get("depth") || "1");
      if (depth < 1) {
        depth = 1;
      }

      const nextParams = new URLSearchParams();

      if (params.get("fingerprint") === "false") {
        nextParams.set("fingerprint", "false");
      }

      const frame = document.createElement("iframe");
      frame.id = "fpd-frame";
      frame.width = "900";
      frame.height = "600";

      if (depth > 1) {
        nextParams.set("depth", String(depth - 1));
        frame.src = "/fpd-iframe?" + nextParams.toString();
      } else {
        const query = nextParams.toString();
        if (query) {
          frame.src = "/fpd?" + query;
        } else {
          frame.src = "/fpd";
        }
      }

      document.body.appendChild(frame);
    </script>
  </body>
</html>
